<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08111f" />
    <meta name="description" content="依玩家實測資料預測 Kingdom Rush Battles 真人對戰獎牌變化。" />
    <title>KRB 獎牌變化預測工具</title>
    <link rel="icon" href="/krb-medal-calculator/favicon.svg" />
    <link rel="stylesheet" href="/krb-medal-calculator/assets/site-20260903-v4.css" />
    <script src="/krb-medal-calculator/assets/model-20260903-v4.js"></script>
    <script src="/krb-medal-calculator/assets/app-20260903-v4.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">⚔ KINGDOM RUSH BATTLES</p>
          <h1>獎牌變化預測工具</h1>
          <p class="intro">只需填入等級數字，順序不影響計算；目前模型不計算卡片稀有度或顏色。</p>
        </div>
        <div class="model-badge">模型 2026-09-03-v4</div>
      </header>

      <div class="battle-grid">
        <section class="battle-panel self-panel" aria-labelledby="self-title">
          <header class="panel-header">
            <span class="panel-emblem" aria-hidden="true">我</span>
            <div><p>BLUE</p><h2 id="self-title">我方</h2></div>
          </header>
          <div class="deck-fields" data-side="self">
            <div class="deck-row hero-row">
              <span class="row-label">英雄</span>
              <input class="level-input" aria-label="我方英雄等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
            <div class="deck-row">
              <span class="row-label">四塔</span>
              <input class="level-input" aria-label="我方第1張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="我方第2張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="我方第3張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="我方第4張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
            <div class="deck-row">
              <span class="row-label">三法術</span>
              <input class="level-input" aria-label="我方第1張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="我方第2張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="我方第3張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
          </div>
        </section>

        <section class="battle-panel opponent-panel" aria-labelledby="opponent-title">
          <header class="panel-header">
            <span class="panel-emblem" aria-hidden="true">對</span>
            <div><p>RED</p><h2 id="opponent-title">對方</h2></div>
          </header>
          <div class="deck-fields" data-side="opponent">
            <div class="deck-row hero-row">
              <span class="row-label">英雄</span>
              <input class="level-input" aria-label="對方英雄等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
            <div class="deck-row">
              <span class="row-label">四塔</span>
              <input class="level-input" aria-label="對方第1張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="對方第2張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="對方第3張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="對方第4張塔等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
            <div class="deck-row">
              <span class="row-label">三法術</span>
              <input class="level-input" aria-label="對方第1張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="對方第2張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
              <input class="level-input" aria-label="對方第3張法術等級" inputmode="numeric" pattern="[0-9]*" maxlength="2" />
            </div>
          </div>
        </section>
      </div>

      <section class="control-panel">
        <div class="result-row" role="radiogroup" aria-label="比賽結果">
          <strong class="result-heading">比賽結果：</strong>
          <button class="result-choice" id="result-win" type="button" role="radio" aria-checked="false" data-result="win"><span class="radio-circle" aria-hidden="true"></span><span>勝利</span></button>
          <button class="result-choice" id="result-loss" type="button" role="radio" aria-checked="false" data-result="loss"><span class="radio-circle" aria-hidden="true"></span><span>敗北</span></button>
        </div>
        <div class="tool-row">
          <button class="secondary-button" id="apply-deck" type="button">套用上次我方牌組</button>
          <button class="secondary-button" id="clear-all" type="button">清除目前輸入資料</button>
        </div>
        <label class="remember-row" for="remember-deck">
          <input id="remember-deck" type="checkbox" />
          <span><strong>記住我的牌組</strong><small>勾選後，完整的我方牌組會保存在這台裝置，下次開啟時自動帶入。</small></span>
        </label>
      </section>

      <section class="prediction-panel" id="prediction-panel" aria-live="polite" hidden>
        <div>
          <p class="section-kicker">模型預測</p>
          <p class="prediction-score" id="prediction-score"></p>
          <p class="prediction-note">依雙方最高 3 張卡的等級總和差直接對照分數。</p>
        </div>
        <div class="actual-field">
          <label for="actual-medal">我方的實際獎牌變化 <small>（不需填入正負號）</small></label>
          <input id="actual-medal" class="actual-input" inputmode="numeric" pattern="[+-]?[0-9]*" maxlength="3" placeholder="例如：30" />
        </div>
        <div id="comparison-status" class="comparison-status" hidden></div>
      </section>

      <section class="report-panel" id="report-panel" hidden>
        <div class="report-heading">
          <div><h2>回報文字</h2><p>無論預測是否命中，都請複製並回報。</p></div>
          <button class="copy-button" id="copy-report" type="button">一鍵複製</button>
        </div>
        <textarea id="report-text" aria-label="自動產生的回報文字" readonly></textarea>
      </section>

      <footer>本工具依玩家實測資料建立；模型版本更新後，預測結果可能改變。</footer>
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
